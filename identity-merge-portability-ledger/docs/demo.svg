<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Identity merge and profile export demo</title>
  <desc id="desc">Dashboard preview for merge queue decisions, export packages, project transfer actions, and signed audit events.</desc>
  <rect width="960" height="540" fill="#f6f7fb"/>
  <rect x="42" y="40" width="876" height="460" rx="10" fill="#ffffff" stroke="#d7dce8"/>
  <text x="72" y="88" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Identity Merge + Profile Export</text>
  <text x="72" y="118" font-family="Arial, sans-serif" font-size="15" fill="#536079">Linked account conflicts, transfer actions, privacy-safe exports</text>

  <g font-family="Arial, sans-serif">
    <rect x="72" y="150" width="180" height="96" rx="8" fill="#e8f7ef" stroke="#a9dec0"/>
    <text x="94" y="185" font-size="34" font-weight="700" fill="#15703a">1</text>
    <text x="94" y="215" font-size="15" fill="#24543a">auto merge</text>

    <rect x="276" y="150" width="180" height="96" rx="8" fill="#fff4de" stroke="#e5c074"/>
    <text x="298" y="185" font-size="34" font-weight="700" fill="#92620c">1</text>
    <text x="298" y="215" font-size="15" fill="#644816">export review</text>

    <rect x="480" y="150" width="180" height="96" rx="8" fill="#fdeceb" stroke="#e6aaa5"/>
    <text x="502" y="185" font-size="34" font-weight="700" fill="#a62b22">2</text>
    <text x="502" y="215" font-size="15" fill="#67231f">blocked merges</text>

    <rect x="684" y="150" width="180" height="96" rx="8" fill="#e9f2ff" stroke="#aac8f4"/>
    <text x="706" y="185" font-size="34" font-weight="700" fill="#235aa6">6</text>
    <text x="706" y="215" font-size="15" fill="#274c7d">signed events</text>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="74" y="292" font-size="18" font-weight="700" fill="#172033">Merge queue</text>
    <rect x="72" y="310" width="386" height="50" rx="7" fill="#f7fbf9" stroke="#cfe9d9"/>
    <circle cx="96" cy="335" r="8" fill="#25a55b"/>
    <text x="114" y="340" font-size="15" fill="#172033">merge-ada-001 ready, role transfers planned</text>

    <rect x="72" y="372" width="386" height="50" rx="7" fill="#fff8f7" stroke="#ebc1bd"/>
    <circle cx="96" cy="397" r="8" fill="#cf3d32"/>
    <text x="114" y="402" font-size="15" fill="#172033">provider conflict blocks shared service merge</text>

    <text x="502" y="292" font-size="18" font-weight="700" fill="#172033">Profile exports</text>
    <rect x="500" y="310" width="364" height="50" rx="7" fill="#f4f8ff" stroke="#c9daf7"/>
    <circle cx="524" cy="335" r="8" fill="#246ac2"/>
    <text x="542" y="340" font-size="15" fill="#172033">Ada full export includes private fields</text>

    <rect x="500" y="372" width="364" height="50" rx="7" fill="#fff4de" stroke="#e5c074"/>
    <circle cx="524" cy="397" r="8" fill="#c08316"/>
    <text x="542" y="402" font-size="15" fill="#172033">Mira export held, private fields redacted</text>
  </g>

  <line x1="72" y1="452" x2="864" y2="452" stroke="#d7dce8"/>
  <text x="72" y="478" font-family="Arial, sans-serif" font-size="14" fill="#536079">Manifest digest and HMAC audit signatures stay stable across reruns.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Credit attestation ledger demo</title>
  <desc id="desc">Dashboard preview showing verified, review, and disputed contributor credits.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <rect x="48" y="42" width="864" height="456" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="82" y="94" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#111827">Credit attestation ledger</text>
  <text x="82" y="126" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">Contributor credit checked before reputation points are released</text>

  <rect x="82" y="158" width="226" height="92" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="106" y="194" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">Verified</text>
  <text x="106" y="230" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#14532d">1</text>

  <rect x="366" y="158" width="226" height="92" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="390" y="194" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#92400e">Needs review</text>
  <text x="390" y="230" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#92400e">3</text>

  <rect x="650" y="158" width="226" height="92" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="674" y="194" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#991b1b">Disputed</text>
  <text x="674" y="230" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#991b1b">1</text>

  <text x="82" y="296" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2937">Moderation queue</text>
  <g font-family="Arial, sans-serif" font-size="16">
    <rect x="82" y="318" width="794" height="42" rx="6" fill="#fee2e2"/>
    <text x="104" y="345" fill="#7f1d1d">CR-003</text>
    <text x="246" y="345" fill="#7f1d1d">open dispute blocks reputation credit</text>

    <rect x="82" y="372" width="794" height="42" rx="6" fill="#fef3c7"/>
    <text x="104" y="399" fill="#78350f">CR-002</text>
    <text x="246" y="399" fill="#78350f">missing evidence and duplicate claim need review</text>

    <rect x="82" y="426" width="794" height="42" rx="6" fill="#dcfce7"/>
    <text x="104" y="453" fill="#14532d">CR-001</text>
    <text x="246" y="453" fill="#14532d">verified software credit releases reputation</text>
  </g>
</svg>

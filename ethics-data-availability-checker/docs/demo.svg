<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Ethics data availability checker demo</title>
  <desc id="desc">Static dashboard preview for reviewer readiness checks.</desc>
  <rect width="960" height="540" fill="#f7f8fb"/>
  <rect x="56" y="42" width="848" height="456" rx="18" fill="#ffffff" stroke="#d8dde8"/>
  <text x="92" y="98" fill="#1c2430" font-family="Arial, sans-serif" font-size="30" font-weight="700">Ethics + Data Availability</text>
  <text x="92" y="132" fill="#647084" font-family="Arial, sans-serif" font-size="16">Neuroimmune Marker Study</text>
  <rect x="92" y="164" width="184" height="92" rx="12" fill="#fff4e0" stroke="#f2c879"/>
  <text x="114" y="198" fill="#9a5a00" font-family="Arial, sans-serif" font-size="15" font-weight="700">Status</text>
  <text x="114" y="230" fill="#3f2b08" font-family="Arial, sans-serif" font-size="28" font-weight="700">blocked</text>
  <rect x="300" y="164" width="184" height="92" rx="12" fill="#edf9f1" stroke="#99d7ad"/>
  <text x="322" y="198" fill="#247643" font-family="Arial, sans-serif" font-size="15" font-weight="700">Ready</text>
  <text x="322" y="230" fill="#154829" font-family="Arial, sans-serif" font-size="28" font-weight="700">2 checks</text>
  <rect x="508" y="164" width="184" height="92" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="530" y="198" fill="#9a3412" font-family="Arial, sans-serif" font-size="15" font-weight="700">Review</text>
  <text x="530" y="230" fill="#7c2d12" font-family="Arial, sans-serif" font-size="28" font-weight="700">1 check</text>
  <rect x="716" y="164" width="148" height="92" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="738" y="198" fill="#b91c1c" font-family="Arial, sans-serif" font-size="15" font-weight="700">Blocked</text>
  <text x="738" y="230" fill="#7f1d1d" font-family="Arial, sans-serif" font-size="28" font-weight="700">1 claim</text>
  <rect x="92" y="294" width="772" height="148" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="120" y="334" fill="#111827" font-family="Arial, sans-serif" font-size="18" font-weight="700">Reviewer actions</text>

  <text x="144" y="376" fill="#374151" font-family="Arial, sans-serif" font-size="16">claim_artifact_not_found: attach the missing model artifact</text>
  <circle cx="124" cy="406" r="6" fill="#d97706"/>
  <text x="144" y="412" fill="#374151" font-family="Arial, sans-serif" font-size="16">approval_expiring: confirm renewal timing before publication</text>
  <text x="120" y="458" fill="#647084" font-family="Arial, sans-serif" font-size="14">Manifest digest and signed audit events are produced by the demo run.</text>

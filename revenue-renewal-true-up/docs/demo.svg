<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Revenue renewal true-up dashboard</title>
  <desc id="desc">Dashboard preview showing renewal queue status, true-up value, churn exposure, and account actions.</desc>
  <rect width="960" height="540" fill="#f7f9fb"/>
  <rect x="32" y="30" width="896" height="84" rx="6" fill="#122033"/>
  <text x="60" y="68" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">SCIBASE Revenue Renewal True-Up</text>
  <text x="60" y="96" font-family="Arial, sans-serif" font-size="15" fill="#b8c7d9">Renewal timing, seat true-ups, payment holds, and churn risk</text>

  <g font-family="Arial, sans-serif">
    <rect x="48" y="142" width="196" height="112" rx="6" fill="#ffffff" stroke="#d9e2ec"/>
    <text x="68" y="176" font-size="14" fill="#56657a">Due within 45 days</text>
    <text x="68" y="222" font-size="42" font-weight="700" fill="#122033">2</text>

    <rect x="268" y="142" width="196" height="112" rx="6" fill="#ffffff" stroke="#d9e2ec"/>
    <text x="288" y="176" font-size="14" fill="#56657a">Blocked renewals</text>
    <text x="288" y="222" font-size="42" font-weight="700" fill="#b42318">1</text>

    <rect x="488" y="142" width="196" height="112" rx="6" fill="#ffffff" stroke="#d9e2ec"/>
    <text x="508" y="176" font-size="14" fill="#56657a">Seat true-up value</text>
    <text x="508" y="222" font-size="38" font-weight="700" fill="#0b6b58">$7.4K</text>

    <rect x="708" y="142" width="196" height="112" rx="6" fill="#ffffff" stroke="#d9e2ec"/>
    <text x="728" y="176" font-size="14" fill="#56657a">Churn exposure</text>
    <text x="728" y="222" font-size="38" font-weight="700" fill="#92400e">$20.5K</text>
  </g>

  <rect x="48" y="292" width="856" height="186" rx="6" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="72" y="326" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#122033">Account queue</text>

  <g font-family="Arial, sans-serif" font-size="14">
    <text x="72" y="365" fill="#122033" font-weight="700">Northstar University Library</text>
    <rect x="334" y="347" width="76" height="26" rx="4" fill="#fee4e2"/>
    <text x="352" y="365" fill="#b42318" font-weight="700">blocked</text>
    <text x="440" y="365" fill="#56657a">Collect invoice, PO, security packet, true-up quote</text>

    <text x="72" y="407" fill="#122033" font-weight="700">River Lab Consortium</text>
    <rect x="334" y="389" width="76" height="26" rx="4" fill="#dcfae6"/>
    <text x="350" y="407" fill="#087443" font-weight="700">expand</text>
    <text x="440" y="407" fill="#56657a">28 seat true-up and new lab expansion notes</text>

    <text x="72" y="449" fill="#122033" font-weight="700">Hillview Methods Lab</text>
    <rect x="334" y="431" width="76" height="26" rx="4" fill="#fef0c7"/>
    <text x="352" y="449" fill="#92400e" font-weight="700">review</text>
    <text x="440" y="449" fill="#56657a">Unused seats, expiring DPA, low health score</text>
  </g>
</svg>
